<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carrancas — Guia do Palácio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);

    --marble:#E8E1CE; --marble-2:#DED4B9; --ink:#211D18; --stone:#C9BFA8;
    --patina:#3F5D52; --patina-2:#345048; --gilt:#A97535; --gilt-2:#8E5F28; --wine:#6B2630;
    --white:#FFFDF8;

    --bg:var(--marble); --backdrop:#171410;
    --surface:var(--white); --surface-2:var(--marble-2);
    --text:var(--ink); --text-muted:#6E6350;
    --border:var(--stone);
    --accent:var(--patina); --accent-contrast:#FFFDF8;
    --accent-2:var(--gilt); --accent-2-contrast:#FFFDF8;
    --accent-3:var(--wine); --accent-3-contrast:#FFFDF8;

    --font-display:'Petrona', Georgia, 'Times New Roman', serif;
    --font-ui:'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17140F; --surface:#221E18; --surface-2:#2B261E;
      --text:#ECE4D2; --text-muted:#AA9F87; --border:#3B352A;
      --accent:#77A092; --accent-contrast:#12160f;
      --accent-2:#D3A45C; --accent-2-contrast:#171208;
      --accent-3:#C17681; --accent-3-contrast:#1c0f11;
      --backdrop:#0C0A08;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17140F; --surface:#221E18; --surface-2:#2B261E;
    --text:#ECE4D2; --text-muted:#AA9F87; --border:#3B352A;
    --accent:#77A092; --accent-contrast:#12160f;
    --accent-2:#D3A45C; --accent-2-contrast:#171208;
    --accent-3:#C17681; --accent-3-contrast:#1c0f11;
    --backdrop:#0C0A08;
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
  *,*::before,*::after{ box-sizing:inherit; }
  body{
    height:100%; margin:0; background:var(--backdrop); color:var(--text);
    font-family:var(--font-ui); -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
  button, input{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--accent-2); outline-offset:2px; border-radius:4px; }

  /* ---------- desktop backdrop ---------- */
  .backdrop-pattern{
    position:fixed; inset:0; z-index:0; background:var(--backdrop);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(169,117,53,.10), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(63,93,82,.14), transparent 45%);
  }
  .backdrop-pattern svg{ position:absolute; inset:0; width:100%; height:100%; opacity:.08; }

  .stage{ position:relative; z-index:1; min-height:100%; display:flex; align-items:center; justify-content:center; padding:32px 16px; }

  .app-shell{
    position:relative; width:100%; max-width:412px; background:var(--bg);
    display:flex; flex-direction:column; overflow:hidden; color:var(--text);
  }
  @media (min-width:481px){
    .app-shell{ height:844px; border-radius:42px; box-shadow:0 40px 90px rgba(0,0,0,.45), 0 0 0 10px #100D0A; }
    .stage{ padding:40px 16px; }
  }
  @media (max-width:480px){
    .app-shell{ height:100%; }
    .stage{ padding:0; }
    .backdrop-pattern{ display:none; }
  }

  /* ---------- header ---------- */
  .app-header{
    flex:0 0 auto; display:flex; align-items:center; gap:10px; justify-content:space-between;
    padding:calc(16px + env(safe-area-inset-top,0px)) 18px 14px;
    background:var(--ink); color:var(--marble); position:relative; z-index:3;
  }
  :root[data-theme="dark"] .app-header, @media (prefers-color-scheme: dark){ }
  .brand{ display:flex; align-items:center; gap:9px; }
  .brand svg{ color:var(--gilt); flex:0 0 auto; }
  .brand-name{ font-family:var(--font-display); font-size:19px; font-weight:600; letter-spacing:.2px; }
  .live-pill{
    display:flex; align-items:center; gap:6px; font-size:11.5px; color:#D9D2BE;
    background:rgba(255,255,255,.08); padding:6px 10px; border-radius:100px; white-space:nowrap;
  }
  .live-dot{ width:6px; height:6px; border-radius:50%; background:#7FBFA6; flex:0 0 auto; }

  /* ---------- main / views ---------- */
  .app-main{ flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; position:relative; }
  .view{ padding:20px 18px 28px; }
  h1.view-title{ font-family:var(--font-display); font-size:26px; margin:0 0 4px; font-weight:600; }
  p.view-sub{ margin:0 0 18px; color:var(--text-muted); font-size:14.5px; line-height:1.5; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; }
  .section-label{ font-size:13px; color:var(--text-muted); margin:22px 0 10px; }
  .section-label:first-child{ margin-top:0; }

  /* home */
  .hello{ font-family:var(--font-display); font-size:15px; color:var(--text-muted); margin:0 0 2px; }
  .headline{ font-family:var(--font-display); font-size:27px; line-height:1.2; margin:0 0 16px; font-weight:600; }

  .affluence-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px 16px; margin-bottom:18px; }
  .affluence-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .affluence-head strong{ font-family:var(--font-display); font-size:16px; font-weight:600; }
  .affluence-tag{ font-size:11.5px; color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent); padding:3px 9px; border-radius:100px; }
  .room-row{ display:flex; align-items:center; gap:10px; margin:8px 0; }
  .room-name{ width:118px; flex:0 0 auto; font-size:13px; color:var(--text-muted); }
  .room-bar{ flex:1 1 auto; height:7px; border-radius:100px; background:var(--surface-2); overflow:hidden; }
  .room-bar-fill{ height:100%; border-radius:100px; background:var(--patina); transition:width .6s ease; }
  .room-pct{ width:34px; text-align:right; font-size:12px; color:var(--text-muted); flex:0 0 auto; }

  .duration-row{ display:flex; gap:10px; margin-bottom:6px; }
  .duration-chip{
    flex:1; border:1px solid var(--border); background:var(--surface); color:var(--text);
    border-radius:14px; padding:14px 8px; text-align:center; cursor:pointer;
  }
  .duration-chip strong{ display:block; font-family:var(--font-display); font-size:20px; }
  .duration-chip span{ font-size:11.5px; color:var(--text-muted); }
  .duration-chip:active{ transform:scale(.97); }

  .about-block p{ font-size:13.5px; line-height:1.55; color:var(--text-muted); margin:0; }

  .link-row{ display:flex; align-items:center; justify-content:space-between; margin-top:16px; color:var(--accent); font-size:14px; font-weight:600; cursor:pointer; }

  /* routes */
  .route-card{ background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:18px; margin-bottom:14px; }
  .route-dur{ display:inline-block; font-size:12px; color:var(--accent-contrast); background:var(--accent); padding:4px 10px; border-radius:100px; margin-bottom:10px; }
  .route-title{ font-family:var(--font-display); font-size:20px; font-weight:600; margin:0 0 6px; }
  .route-desc{ font-size:13.5px; color:var(--text-muted); line-height:1.5; margin:0 0 12px; }
  .route-meta{ font-size:12px; color:var(--text-muted); margin-bottom:14px; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:12px; padding:12px 16px; font-size:14.5px; font-weight:600;
    cursor:pointer; width:100%;
  }
  .btn-primary{ background:var(--patina); color:var(--accent-contrast); }
  .btn-ghost{ background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn:active{ transform:scale(.98); }
  .btn-row{ display:flex; gap:8px; }
  .btn-row .btn{ width:auto; flex:1; }
  .btn-sm{ padding:9px 12px; font-size:13px; }

  /* route detail */
  .back-row{ display:flex; align-items:center; gap:6px; color:var(--text-muted); font-size:13.5px; margin-bottom:10px; cursor:pointer; width:fit-content; }
  .progress-track{ height:6px; border-radius:100px; background:var(--surface-2); margin-bottom:18px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--gilt); border-radius:100px; transition:width .5s ease; }
  .stop{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:12px; }
  .stop.visited{ border-color:var(--accent); }
  .stop-top{ display:flex; align-items:flex-start; gap:10px; margin-bottom:10px; }
  .stop-check{
    width:26px; height:26px; border-radius:50%; border:1.5px solid var(--border); flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; color:var(--accent-contrast);
  }
  .stop.visited .stop-check{ background:var(--accent); border-color:var(--accent); }
  .stop-room{ font-size:11.5px; text-transform:none; color:var(--accent); font-weight:600; }
  .stop-name{ font-family:var(--font-display); font-size:17px; font-weight:600; margin:1px 0 2px; }
  .stop-author{ font-size:12.5px; color:var(--text-muted); }
  .stop-clue{ font-size:12.5px; color:var(--text-muted); font-style:italic; margin:0 0 10px; line-height:1.4; }

  /* guide */
  .profile-row{ display:flex; gap:8px; margin-bottom:14px; }
  .profile-chip{ flex:1; text-align:center; padding:9px 6px; border-radius:100px; border:1px solid var(--border); background:var(--surface); font-size:12.5px; cursor:pointer; color:var(--text-muted); }
  .profile-chip.active{ background:var(--ink); color:var(--marble); border-color:var(--ink); }
  .piece-scroll{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px; }
  .piece-chip{ flex:0 0 auto; padding:8px 13px; border-radius:100px; border:1px solid var(--border); background:var(--surface); font-size:12.5px; color:var(--text-muted); cursor:pointer; white-space:nowrap; }
  .piece-chip.active{ background:var(--accent); color:var(--accent-contrast); border-color:var(--accent); }
  .guide-context{ background:var(--surface-2); border-radius:14px; padding:12px 14px; margin-bottom:14px; font-size:12.5px; color:var(--text-muted); line-height:1.5; }
  .guide-context strong{ color:var(--text); font-family:var(--font-display); font-size:14.5px; display:block; margin-bottom:2px; }
  .chat-log{ display:flex; flex-direction:column; gap:10px; margin-bottom:14px; min-height:60px; }
  .bubble{ max-width:86%; padding:10px 13px; border-radius:14px; font-size:13.5px; line-height:1.5; }
  .bubble.user{ align-self:flex-end; background:var(--patina); color:var(--accent-contrast); border-bottom-right-radius:4px; }
  .bubble.assistant{ align-self:flex-start; background:var(--surface); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .bubble.assistant.pending{ color:var(--text-muted); font-style:italic; }
  .bubble.assistant.err{ border-color:var(--accent-3); color:var(--accent-3); }
  .chat-empty{ font-size:13px; color:var(--text-muted); text-align:center; padding:14px 6px; }
  .chat-form{ display:flex; gap:8px; position:sticky; bottom:0; background:var(--bg); padding-top:4px; }
  .chat-input{ flex:1; border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:100px; padding:11px 16px; font-size:13.5px; }
  .chat-send{ width:42px; height:42px; border-radius:50%; border:none; background:var(--accent); color:var(--accent-contrast); flex:0 0 auto; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .chat-send:disabled{ opacity:.5; }
  .chat-note{ font-size:11.5px; color:var(--text-muted); text-align:center; margin-top:10px; }
  .stop-btn{ background:transparent; border:none; }

  /* achievements */
  .points-card{ background:var(--ink); color:var(--marble); border-radius:18px; padding:18px; margin-bottom:20px; display:flex; align-items:center; justify-content:space-between; }
  .points-num{ font-family:var(--font-display); font-size:34px; font-weight:600; color:var(--gilt); }
  .points-label{ font-size:12.5px; color:#CFC6AE; }
  .badge-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:18px; }
  .badge{ aspect-ratio:1; border-radius:16px; border:1px solid var(--border); background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:6px; text-align:center; }
  .badge.unlocked{ border-color:var(--gilt); background:color-mix(in srgb, var(--gilt) 10%, var(--surface)); }
  .badge svg{ color:var(--text-muted); }
  .badge.unlocked svg{ color:var(--gilt); }
  .badge-label{ font-size:9.5px; color:var(--text-muted); line-height:1.2; }
  .badge.unlocked .badge-label{ color:var(--text); }
  .unlock-banner{ background:var(--surface-2); border:1px dashed var(--gilt); border-radius:14px; padding:13px 15px; font-size:13px; color:var(--text); line-height:1.5; margin-bottom:6px; }

  /* nav */
  .app-nav{
    flex:0 0 auto; display:flex; justify-content:space-around; align-items:center;
    background:var(--surface); border-top:1px solid var(--border);
    padding:9px 8px calc(9px + env(safe-area-inset-bottom,0px)); position:relative; z-index:3;
  }
  .nav-btn{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-muted); font-size:10.5px; padding:4px 10px; cursor:pointer; }
  .nav-btn.active{ color:var(--accent); }

  /* modal */
  .modal-layer{ position:absolute; inset:0; background:rgba(10,8,6,.55); display:flex; align-items:flex-end; z-index:10; }
  @media (min-width:481px){ .modal-layer{ align-items:center; justify-content:center; } }
  .modal{ background:var(--surface); width:100%; border-radius:20px 20px 0 0; padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px)); max-height:86%; overflow-y:auto; }
  @media (min-width:481px){ .modal{ border-radius:20px; max-width:340px; } }
  .modal-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .modal-title{ font-family:var(--font-display); font-size:18px; font-weight:600; }
  .modal-close{ background:none; border:none; color:var(--text-muted); cursor:pointer; padding:4px; }
  .quiz-opt{ display:block; width:100%; text-align:left; border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:12px; padding:12px 14px; margin-bottom:8px; font-size:13.5px; cursor:pointer; }
  .quiz-opt.correct{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--surface)); }
  .quiz-opt.wrong{ border-color:var(--accent-3); background:color-mix(in srgb, var(--accent-3) 12%, var(--surface)); }
  .quiz-feedback{ font-size:13px; color:var(--text-muted); line-height:1.5; margin:12px 0 16px; }
  .quiz-result{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .quiz-result strong{ font-family:var(--font-display); font-size:19px; }

  /* toast */
  .toast-layer{ position:absolute; left:14px; right:14px; bottom:14px; display:flex; flex-direction:column; gap:8px; z-index:20; pointer-events:none; }
  .toast{ background:var(--ink); color:var(--marble); font-size:12.5px; padding:11px 14px; border-radius:12px; box-shadow:0 10px 24px rgba(0,0,0,.3); animation:toast-in .25s ease; }
  @keyframes toast-in{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none; } }

  .empty-state{ text-align:center; padding:40px 16px; color:var(--text-muted); font-size:13.5px; }
</style>
</head>
<body>

<div class="backdrop-pattern" aria-hidden="true">
  <svg xmlns="http://www.w3.org/2000/svg"><defs>
    <pattern id="carranca-tile" width="120" height="120" patternUnits="userSpaceOnUse">
      <g transform="translate(36,36) scale(1.1)" fill="none" stroke="#A97535" stroke-width="1.4">
        <path d="M24 5c8.5 0 14 6.8 14 14.4 0 2.7-.8 4.7-1.9 6.6 1.1 1.9 1.9 3.6 1.9 6C38 37.3 32 41 24 41S10 37.3 10 32c0-2.4.8-4.1 1.9-6C10.8 24.1 10 22.1 10 19.4 10 11.8 15.5 5 24 5Z"/>
        <circle cx="17.5" cy="20" r="2.6"/><circle cx="30.5" cy="20" r="2.6"/>
        <path d="M15 30c1.5 2 4.6 3.2 9 3.2s7.5-1.2 9-3.2"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#carranca-tile)"/>
  </svg>
</div>

<div class="stage">
  <main class="app-shell" id="app-shell">

    <header class="app-header">
      <div class="brand" id="brand-icon-slot"></div>
      <div class="live-pill" id="live-pill"><span class="live-dot"></span><span id="live-pill-text">A carregar…</span></div>
    </header>

    <div class="app-main" id="app-main">
      <div class="view" id="view-content"></div>
    </div>

    <nav class="app-nav" id="app-nav"></nav>

    <div id="modal-root"></div>
    <div class="toast-layer" id="toast-layer"></div>
  </main>
</div>

<script>
(function(){
"use strict";

/* ============ ICONS ============ */
const ICONS = {
  home: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10.5V20h5v-5h2v5h5v-9.5"/></svg>',
  map: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 4 6v14l5-2 6 2 5-2V4l-5 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>',
  chat: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4V5Z"/></svg>',
  medal: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 8.5 7 3h3l2 3.5M15 8.5l2-5.5h-3l-2 3.5"/><circle cx="12" cy="14" r="6"/><circle cx="12" cy="14" r="2.2"/></svg>',
  check: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9 17 20 6"/></svg>',
  qr: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h3v3h-3zM20 14v3M17 20h3"/></svg>',
  send: '<svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" stroke="none"><path d="M4 12 20 4 13 20l-2-7-7-1Z"/></svg>',
  close: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5 19 19M19 5 5 19"/></svg>',
  back: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  lock: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
};
function carranca(size){
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
    + '<path d="M24 5c8.5 0 14 6.8 14 14.4 0 2.7-.8 4.7-1.9 6.6 1.1 1.9 1.9 3.6 1.9 6C38 37.3 32 41 24 41S10 37.3 10 32c0-2.4.8-4.1 1.9-6C10.8 24.1 10 22.1 10 19.4 10 11.8 15.5 5 24 5Z" stroke="currentColor" stroke-width="2"/>'
    + '<path d="M6 16c-2.5 1-4 3.3-4 6M42 16c2.5 1 4 3.3 4 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
    + '<circle cx="17.5" cy="20" r="2.6" stroke="currentColor" stroke-width="2"/><circle cx="30.5" cy="20" r="2.6" stroke="currentColor" stroke-width="2"/>'

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    state.profile = saved.profile || state.profile;
    state.visited = Array.isArray(saved.visited) ? saved.visited : [];
    state.badges = Array.isArray(saved.badges) ? saved.badges : [];
    state.points = typeof saved.points === 'number' ? saved.points : 0;
  }catch(e){ /* start fresh */ }
}
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ profile:state.profile, visited:state.visited, badges:state.badges, points:state.points }));
  }catch(e){ /* storage unavailable, continue in-memory */ }
}

let affluence = { escultura:52, pintura:64, decorativas:34, atrio:22 };
function stepAffluence(){
  Object.keys(affluence).forEach(k=>{
    const delta = Math.round((Math.random()-0.5) * 22);
    affluence[k] = Math.min(94, Math.max(6, affluence[k] + delta));
  });
  const quietest = Object.keys(affluence).sort((a,b)=>affluence[a]-affluence[b])[0];
  document.getElementById('live-pill-text').textContent = SALAS[quietest] + ' tranquila';
  if(affluence[quietest] < 22 && quietest !== lastNotified){
    lastNotified = quietest;
    pushToast('🔔 ' + SALAS[quietest] + ' está tranquila agora — boa altura para visitar.');
  }
  if(state.view === 'home') renderView();
}

/* ============ SAMPLE (AI Guide) CAPABILITY ============ */
let sample = null;
let sampleState = 'loading'; // loading | ready | unavailable | denied
(async function initSample(){
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      sample = await window.claude.use('sample');
    }
  }catch(e){ sample = null; }
  sampleState = sample ? 'ready' : 'unavailable';
  if(state.view === 'guide') renderView();
})();

const chatState = {}; // pieceId|'geral' -> [{role, content}]
let currentAbort = null;

function buildRules(piece){
  const perfil = PERFIS[state.profile].texto;
  const pieceTexto = piece
    ? 'Obra em foco: "' + piece.nome + '", de ' + piece.autor + (piece.ano ? ' (' + piece.ano + ')' : '') + ', ' + SALAS[piece.sala] + '. ' + piece.resumo
    : 'Não há nenhuma obra selecionada: responde a perguntas gerais sobre o Museu Nacional Soares dos Reis, instalado no Palácio dos Carrancas, no Porto, o museu público de arte mais antigo de Portugal (fundado em 1833).';
  return 'És o Guia IA do Museu Nacional Soares dos Reis (MNSR), dentro de uma aplicação para visitantes. Responde sempre em português europeu, em no máximo 90 palavras, com um tom acolhedor e rigoroso. ' + perfil + '\n\n' + pieceTexto + '\n\nSe não souberes algo com certeza, di-lo com honestidade em vez de inventar.';
}

async function sendGuideQuestion(question){
  const key = state.activePieceId || 'geral';
  if(!chatState[key]) chatState[key] = [];
  const turns = chatState[key];
  turns.push({ role:'user', content: question });
  turns.push({ role:'assistant', content:'', pending:true }); // placeholder
  renderView();

  const rules = buildRules(state.activePieceId ? byId(state.activePieceId) : null);
  const ctl = new AbortController();
  currentAbort = ctl;
  const history = turns.slice(0, -1); // conversation so far, excluding the placeholder

  try{
    const { text } = await sample([{ role:'user', content: rules }, ...history], {
      signal: ctl.signal,
      cache: false,
      modelTier: 'quick',
      onText: ({ text }) => { turns[turns.length-1].content = text; turns[turns.length-1].pending = true; renderChatOnly(); }
    });
    turns[turns.length-1].content = text;
    turns[turns.length-1].pending = false;
  }catch(e){
    const code = e && e.code;
    const last = turns[turns.length-1];
    if(code === 'cancelled'){
      if(last && last.role==='assistant' && !last.content) turns.pop();
      else if(last) last.pending = false;
    } else if(e && e.text){
      // keep whatever had already streamed before the failure
      last.content = e.text;
      last.pending = false;
    } else {
      turns.pop();
      if(code === 'not_granted'){
        sampleState = 'denied';
      } else {
        let msg = 'Não foi possível obter resposta agora. Tente novamente.';
        if(code === 'rate_limited') msg = 'Muitos pedidos em simultâneo — tente novamente dentro de instantes.';
        else if(code === 'refused') msg = 'O Guia IA não conseguiu responder a este pedido. Tente reformular a pergunta.';
        turns.push({ role:'assistant', content: msg, isError:true });
      }
    }
  }
  renderView();
}

function viewGuide(){
  const piece = state.activePieceId ? byId(state.activePieceId) : null;

  let bodyHtml = '';

  if(sampleState === 'unavailable'){
    bodyHtml = '<div class="chat-empty">O Guia IA não está disponível nesta visualização do protótipo.</div>';
  } else if(sampleState === 'denied'){
    bodyHtml = '<div class="chat-empty">Este protótipo não tem autorização para usar o Guia IA nesta sessão.</div>';
  } else {
    bodyHtml = ''
      + '<div class="section-label">Adaptar respostas a</div>'
      + '<div class="profile-row">' + Object.keys(PERFIS).map(k=>'<div class="profile-chip'+(state.profile===k?' active':'')+'" data-action="set-profile" data-profile="'+k+'">'+PERFIS[k].label+'</div>').join('') + '</div>'

      + '</div>'
      + (piece ? '<div class="guide-context"><strong>'+piece.nome+'</strong>'+piece.autor+(piece.ano?' · '+piece.ano:'')+' · '+SALAS[piece.sala]+'</div>' : '')
      + '<div class="chat-log" id="chat-log">'
        + (turns.length ? turns.map(t=>{
            const cls = t.role==='user' ? 'user' : ('assistant' + (t.pending?' pending':'') + (t.isError?' err':''));
            const text = t.role==='assistant' && t.pending && !t.content ? 'A pensar…' : (t.content || 'A pensar…');
            return '<div class="bubble '+cls+'">'+escapeHtml(text)+'</div>';
          }).join('') : '<div class="chat-empty">Pergunte algo sobre '+(piece?('"'+piece.nome+'"'):'o museu')+' — por exemplo, "quando foi feita esta obra?".</div>')
      + '</div>'
      + '<form class="chat-form" id="chat-form">'
        + '<input class="chat-input" id="chat-input" type="text" placeholder="Escreva a sua pergunta…" autocomplete="off">'
        + '<button class="chat-send" type="submit" id="chat-send">'+ICONS.send+'</button>'
      + '</form>'
      + '<p class="chat-note">As respostas são geradas por IA e podem conter imprecisões.</p>';
  }

  return '<h1 class="view-title">Guia IA</h1><p class="view-sub">O assistente virtual do museu, adaptado a si.</p>' + bodyHtml;
}

function renderChatOnly(){
  const log = document.getElementById('chat-log');

  const turns = chatState[key] || [];
  log.innerHTML = turns.map(t=>{
    const cls = t.role==='user' ? 'user' : ('assistant' + (t.pending?' pending':'') + (t.isError?' err':''));
    const text = t.role==='assistant' && t.pending && !t.content ? 'A pensar…' : (t.content || 'A pensar…');
    return '<div class="bubble '+cls+'">'+escapeHtml(text)+'</div>';
  }).join('');

}

    }).join('') + '</div>'
  + (state.badges.length >= 4
      ? '<div class="unlock-banner">🎉 Desconto de 10% desbloqueado na loja do museu — mostre este ecrã na loja.</div>'
      : '<div class="unlock-banner">Desbloqueie 4 medalhas para ganhar 10% de desconto na loja do museu. Faltam '+Math.max(0,4-state.badges.length)+'.</div>');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============ ACTIONS ============ */
function bindViewActions(){
  const root = document.getElementById('view-content');
  root.querySelectorAll('[data-action]').forEach(node=>{
    const action = node.getAttribute('data-action');
    if(action === 'go-route'){
      node.addEventListener('click', ()=>{ state.activeRouteId = node.getAttribute('data-route-id'); state.view='route-detail'; renderView(); });
    } else if(action === 'go-routes-tab'){
      node.addEventListener('click', ()=>{ state.view='routes'; renderView(); });
    } else if(action === 'quick-duration'){
      node.addEventListener('click', ()=>{
        const d = parseInt(node.getAttribute('data-duration'),10);
        const r = ROTEIROS.find(r=>r.duracao===d);
        state.activeRouteId = r.id; state.view='route-detail'; renderView();
      });
    } else if(action === 'scan-qr'){
      node.addEventListener('click', ()=> openQuizModal(node.getAttribute('data-piece-id')) );
    } else if(action === 'ask-about'){
      node.addEventListener('click', ()=>{ state.activePieceId = node.getAttribute('data-piece-id'); state.view='guide'; renderView(); });
    } else if(action === 'select-piece'){
      node.addEventListener('click', ()=>{ state.activePieceId = node.getAttribute('data-piece-id') || null; renderView(); });
    } else if(action === 'set-profile'){
      node.addEventListener('click', ()=>{ state.profile = node.getAttribute('data-profile'); saveState(); renderView(); });
    }
  });

  const form = document.getElementById('chat-form');
  if(form){
    form.addEventListener('submit', e=>{
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const val = input.value.trim();
      if(!val || !sample) return;
      input.value = '';
      sendGuideQuestion(val);
    });
  }
}

/* ============ QUIZ MODAL ============ */
function openQuizModal(pieceId){
  const p = byId(pieceId);
  const root = document.getElementById('modal-root');
  const alreadyVisited = state.visited.includes(pieceId);
  root.innerHTML = ''
    + '<div class="modal-layer" id="modal-layer">'
      + '<div class="modal">'
        + '<div class="modal-top"><span class="modal-title">Pista lida</span><button class="modal-close" id="modal-close">'+ICONS.close+'</button></div>'
        + (alreadyVisited
          ? '<p class="quiz-feedback">Já concluiu esta paragem — a sua medalha de "'+p.nome+'" está guardada em Conquistas.</p><button class="btn btn-primary" id="modal-ok">Fechar</button>'
          : ''
            + '<p class="quiz-feedback"><strong>'+p.nome+'</strong> · '+p.curiosidade+'</p>'
            + '<p class="quiz-feedback" style="margin-top:-8px"><strong>'+p.quiz.pergunta+'</strong></p>'
            + '<div id="quiz-opts">' + p.quiz.opcoes.map((op,i)=>'<button class="quiz-opt" data-i="'+i+'">'+op+'</button>').join('') + '</div>'
            + '<div id="quiz-after"></div>'
          )
      + '</div>'
    + '</div>';

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-layer').addEventListener('click', e=>{ if(e.target.id==='modal-layer') closeModal(); });
  const okBtn = document.getElementById('modal-ok');
  if(okBtn) okBtn.addEventListener('click', closeModal);

  const opts = document.getElementById('quiz-opts');
  if(opts){
    opts.querySelectorAll('.quiz-opt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const i = parseInt(btn.getAttribute('data-i'),10);
        const correct = i === p.quiz.resposta;
        opts.querySelectorAll('.quiz-opt').forEach((b,bi)=>{
          b.disabled = true;
          if(bi === p.quiz.resposta) b.classList.add('correct');
          else if(bi === i && !correct) b.classList.add('wrong');
        });
        const gained = correct ? 10 : 4;
        state.points += gained;
        if(!state.visited.includes(pieceId)) state.visited.push(pieceId);
        if(!state.badges.includes(pieceId)) state.badges.push(pieceId);
        saveState();
        document.getElementById('quiz-after').innerHTML = ''
          + '<div class="quiz-result">'+carranca(30)+'<strong>+'+gained+' pontos</strong></div>'
          + '<p class="quiz-feedback">'+p.quiz.explicacao+'</p>'
          + '<button class="btn btn-primary" id="modal-ok-2">Continuar</button>';
        document.getElementById('modal-ok-2').addEventListener('click', ()=>{ closeModal(); renderView(); });
        pushToast('🏅 Medalha "'+p.nome+'" desbloqueada!');
      });
    });
  }
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

/* ============ INIT ============ */
renderView();

})();
</script>
</body>
</html>
